name: Testar e empacotar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:13', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Gerar, instalar, testar e remover DEB
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:z" -w /src "$IMAGE" sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y appstream dpkg-dev python3 python3-gi gir1.2-gtk-3.0 cups-client xvfb desktop-file-utils
            ./scripts/build-deb.sh
            apt-get install -y --no-install-recommends ./dist/zebra-raw_$(cat VERSION)_all.deb
            ./scripts/check-package.sh
            apt-get remove -y zebra-raw
            test ! -e /usr/bin/zebra-raw
          '
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist/*.deb
  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar, instalar, testar e remover RPM
        run: |
          docker run --rm -v "$PWD:/src:z" -w /src opensuse/tumbleweed sh -ec '
            zypper --non-interactive install appstream rpm-build tar gzip python3-gobject typelib-1_0-Gtk-3_0 cups-client xorg-x11-server-Xvfb desktop-file-utils
            ./scripts/build-rpm.sh
            zypper --non-interactive install --allow-unsigned-rpm ./dist/zebra-raw-$(cat VERSION)-1.noarch.rpm
            ./scripts/check-package.sh
            zypper --non-interactive remove zebra-raw
            test ! -e /usr/bin/zebra-raw
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-opensuse
          path: dist/*.rpm
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk3
      - name: Gerar executável portátil
        shell: msys2 {0}
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pywin32
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Zebra-RAW --icon icons/zebra-raw.ico --add-data 'icons/zebra-raw.ico:icons' --hidden-import win32print --hidden-import gi.repository.GLib --hidden-import gi.repository.GObject --hidden-import gi.repository.Gio --hidden-import gi.repository.GdkPixbuf --hidden-import gi.repository.Gtk zebra.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/Zebra-RAW.exe
